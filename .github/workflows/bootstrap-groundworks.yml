name: Import Groundworks source
on:
  push:
    branches: [building-design]
    paths: [.bootstrap/READY]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: building-design
      - name: Reconstruct uploaded Groundworks files
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/groundworks-import.tar.xz
          test "$(sha256sum /tmp/groundworks-import.tar.xz | awk '{print $1}')" = "a77360e7fcc3db24608f902daf8666a6ca9e0e3c915510b7c5f406376a22795a"
          tar -xJf /tmp/groundworks-import.tar.xz
          test "$(sha256sum dist/index.html | awk '{print $1}')" = "ce0b9852d176e960208435a11b3e5611f2db54af73b461ed7d6d786a8a9e7390"
          test "$(sha256sum GDD.txt | awk '{print $1}')" = "88a3a4ba64e4c28a10ff5593044cb42a2a62dae9705a12b996a01ff5e998fc3d"
          test "$(sha256sum groundworksatlas.html | awk '{print $1}')" = "8e704614919de5e9b1d2f341b28d0b9acc8368a29c764e620e80cad312e7f607"
          rm -rf .bootstrap .github/workflows/bootstrap-groundworks.yml
          git config user.name "Groundworks Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Groundworks map, GDD, and production atlas"
          git push origin HEAD:building-design
